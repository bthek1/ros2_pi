# Parameters for the pimesh pipeline.
#
# KEYED BY NODE NAME. A top-level key that does not match a running node's name
# applies nothing at all — no warning, no error, no effect. This trap has cost
# the predecessor project real time more than once; check `ros2 node list`
# against the keys here before concluding a parameter "does not work".
#
# Every parameter a node reads is declared in the node with a description and a
# validated range. This file supplies values, not the schema.
#
# Each phase of the bootstrap plan adds its own section as its node lands.
# Sections for nodes that do not exist yet are deliberately absent rather than
# commented-out guesses.

# --- P1, on the Pi ---------------------------------------------------------
#
# camera_node's parameters live in pimesh_camera/config/camera.yaml, NOT here.
# The Pi builds only pimesh_msgs and pimesh_camera, so the sensor head has to
# carry its own launch and its own configuration — it must be startable with
# nothing from the dev box present.

# --- P2, in the container --------------------------------------------------

decode_node:
  ros__parameters:
    # The container's only network subscriber and its only JPEG decode.
    stats_period_s: 1.0
    # No frame for this long marks the stage stale on /pipeline/stats. Two
    # seconds is ~60 frames at the camera's rate: long enough that a Wi-Fi
    # hiccup does not flap the flag, short enough to notice a dead Pi.
    stale_after_s: 2.0
    # Address logging is a diagnostic for `just gate-ipc`, which overrides this
    # on the command line. Zero here so a normal session logs nothing.
    log_buffer_addresses: 0

ipc_probe_node:
  ros__parameters:
    # Only loaded when the launch is given `probe:=true`. Ten frames is plenty
    # to compare addresses and short enough not to bury the launch output.
    frames: 10

# --- P3, in the container --------------------------------------------------

keypoint_node:
  ros__parameters:
    # ORB. The feature cap is the predecessor's; the pyramid is NOT — OpenCV
    # defaults to 8 levels, which measured 9.6 ms/frame at 1280x720 here
    # against 6.8 ms at 4 (2026-09-07). Four levels still span a 1.73x scale
    # range, and consecutive frames 30 ms apart barely change scale at all.
    max_features: 500
    pyramid_levels: 4
    scale_factor: 1.2
    # The POOLED match window — "have I seen this point recently?". It does not
    # touch the odometry, which always matches strictly against the previous
    # frame. 10 frames forgives the detection churn that costs consecutive-only
    # matching ~25% of its keypoints.
    match_window: 10
    # Hamming bits of 256 above which a match is a similar-looking corner
    # rather than the same physical point.
    match_max_distance: 64

    # The pose gate. Below min_matched_pairs, or above max_residual_rad mean
    # ray residual, the node HOLDS the last pose instead of publishing a guess
    # — fusion integrates depth at whatever pose it is handed, and one bad
    # rotation smears the room permanently.
    min_matched_pairs: 8
    max_residual_rad: 0.03

    # The annotated preview leaves the container, so it is drawn, JPEG-encoded
    # and serialised. Deliberately far below the frame rate: at 30-60 Hz it
    # would spend most of this stage's budget on a picture for humans.
    preview_rate_hz: 10.0
    jpeg_quality: 80

    # EXACTLY ONE node may own odom -> base_link. Two publishers on one edge
    # is the failure that smears a mesh and appears in no single log.
    publish_tf: true
    odom_frame: odom
    base_frame: base_link

    stats_period_s: 1.0
    stale_after_s: 2.0

# --- P4, in the container --------------------------------------------------

depth_node:
  ros__parameters:
    # model_path is NOT here: models/ lives in the source workspace, not in the
    # installed share/ tree, so the launch passes it through the PIMESH_MODEL
    # environment variable that the `just` recipes export.

    # The ViT works on 14x14 patches, so this MUST be a multiple of 14.
    # 518 = 37 x 14 is the size the model was trained at; measured 52.5 ms a
    # frame on this GPU (2026-09-08), against the predecessor's 72-79 ms for
    # the same model through Python.
    input_side: 518
    # false forces the CPU path — for measuring the fallback deliberately
    # rather than discovering it. ~290 ms a frame.
    use_cuda: true

    # THIS NUMBER IS ARBITRARY. Monocular depth is relative: the model says
    # "twice as far", never "three metres". z = depth_scale / output, and
    # nothing pins the scale until P5's tape measure does — the predecessor's
    # room came out at 2.69. No stage downstream may assume metres are real
    # before then.
    depth_scale: 10.0
    # Everything further reads as exactly this. Applied BEFORE the reciprocal,
    # by flooring the inverse depth, so 1/x never explodes on the values the
    # model means as "background, no idea".
    max_depth_m: 6.0

    stats_period_s: 1.0
    # Longer than the other stages' 2 s: this one runs at ~19 Hz by design and
    # a GPU hiccup should not flap the stale flag.
    stale_after_s: 5.0
    optical_frame: camera_optical_frame
