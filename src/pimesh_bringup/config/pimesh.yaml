# Every parameter this workspace sets, keyed by node name.
#
# `/**` matches any namespace, so a key reaches its node whether it sits at the
# root or is pushed under one by a launch file. A key that matches *nothing* is
# not an error and never will be: the file loads, the parameter is silently
# never applied, and the node runs on its code default. That is the trap this
# project's predecessor lost real time to, so every gate here asserts on a
# parameter's *effect* rather than on the file having been read.

# --- The camera's place on the body -----------------------------------------
#
# Two static edges, base_link -> camera_link -> camera_optical_frame, published
# by tf2_ros/static_transform_publisher rather than hand-rolled inside a node.
# There is exactly one publisher per edge in this project and this is where both
# of these live; a node that publishes its own base_link -> camera_link is the
# failure that makes a mesh smear and shows up in no single log.

/**/base_to_camera:
  ros__parameters:
    frame_id: base_link
    child_frame_id: camera_link
    # Identity, and honestly so: the C922 is hand-held, so there is no measured
    # offset between the body origin and the camera yet. When it is mounted,
    # this is the one place that changes and nothing recompiles.
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

/**/camera_to_optical:
  ros__parameters:
    frame_id: camera_link
    child_frame_id: camera_optical_frame
    translation: {x: 0.0, y: 0.0, z: 0.0}
    # The REP-103 body convention (x forward, y left, z up) rotated into the
    # optical convention (z forward, x right, y down). This exact quaternion,
    # (-0.5, 0.5, -0.5, 0.5), is the standard -90 deg about z then -90 deg about
    # x; it is not a number to re-derive per node, which is why it is a static
    # transform published once and read by everything.
    #
    # All geometry in this pipeline — keypoint rays, depth unprojection, TSDF
    # integration — is done in camera_optical_frame. This edge is what lets the
    # rest of the tree stay in the body convention.
    rotation: {x: -0.5, y: 0.5, z: -0.5, w: 0.5}

# The map -> odom edge, published as static identity until there is a pose-graph
# backend to publish it for real (P8). Stated here rather than hidden, because
# "the frame exists so RViz has a fixed frame" and "the map is being corrected"
# look identical in a TF tree and are not the same claim.
/**/map_to_odom:
  ros__parameters:
    frame_id: map
    child_frame_id: odom
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

# --- The dev box's pipeline ---------------------------------------------------
#
# Keyed by node name, and the names have to match the `name=` of the
# ComposableNode in pimesh.launch.py exactly. A key matching no node applies
# nothing, silently — which is why every gate here asserts on a parameter's
# *effect*, never on the file having been read.

/**/decode_node:
  ros__parameters:
    # The only topic in this project that crosses Wi-Fi, and the only subscriber
    # this process has on it. gates/ipc.sh asserts that second half.
    input_topic: /image_raw/compressed
    # bgr8, for consumers inside this container. A subscriber from another
    # process may have it, and will cost a 2.7 MB serialisation per frame for the
    # privilege — which is why rviz/keypoints.rviz watches the compressed preview
    # instead.
    output_topic: /image_raw
    # reliable | best_effort, on the subscription. See decode_node.cpp: the
    # BEST_EFFORT-reader measurement that rviz/camera.rviz relies on was taken on
    # a *viewer*, where a dropped frame costs nothing, and a dropped frame here is
    # a frame the mesh never sees. The conservative default stands until somebody
    # measures this end.
    input_reliability: reliable
    gap_threshold_ms: 50.0
    stats_period_s: 5.0
    # Off: at 59 Hz this is 59 log lines a second. gates/ipc.sh overrides it.
    log_payloads: false

/**/ipc_probe:
  ros__parameters:
    input_topic: /image_raw

/**/keypoint_node:
  ros__parameters:
    # P3's numbers. 500 features is enough that churn at the cap does not dominate
    # and cheap enough for the full frame rate; the 10-frame window is what
    # forgives detection churn, which strict frame-to-frame matching counts as
    # ~25% of keypoints lost; 64 of 256 Hamming bits is already generous, since
    # unrelated ORB descriptors sit near 128 apart.
    max_features: 500
    match_window: 10
    match_max_distance: 64
    # The pose gates. Failing either means *hold the last pose* — never publish a
    # guess, because a wrong orientation folds the mesh around it and nothing
    # downstream can tell which frames were guesses.
    #
    # 0.03 rad is 1.7 degrees, ~28 px at fx=953. Note it is not equally sharp in
    # all three axes: the ray residual of a roll about the optical axis is about a
    # third of the same angle in pan or tilt, because rays near the axis of
    # rotation barely move (test_rotation_fit has the measurement).
    min_matched_pairs: 8
    max_residual_rad: 0.03
    reject_fraction: 0.2
    # For a person, not for the pipeline: ~10 Hz of annotated JPEG. Encoding it
    # costs more than detecting the features does, which is why it is capped and
    # why its cost is reported separately in the stats line.
    preview_rate_hz: 10.0
    preview_quality: 80
    # odom -> base_link, rotation only, translation identically zero. P7 is what
    # makes the translation real.
    publish_tf: true
    odom_frame: odom
    base_frame: base_link
    stats_period_s: 5.0

/**/depth_node:
  ros__parameters:
    # Two consumers on the decoded topic now — keypoint_node and this one — which
    # is the configuration the zero-copy claim is actually about. See
    # depth_node.hpp: rclcpp moves the buffer into the *last* ownership-taking
    # subscription and copies it for every other, so both of them take a
    # ConstSharedPtr and gates/ipc.sh asserts at least two subscribers while it
    # measures.
    input_topic: /image_raw
    # 32FC1 metres, and the exact frame each map was inferred on. The second is
    # not a convenience: a separate republisher would drop *different* frames from
    # this node, so their stamp sets would rarely intersect and an exact-sync
    # consumer would limp at a fraction of either rate.
    depth_topic: /depth
    rgb_topic: /depth/rgb
    publish_rgb: true
    # For a person, not for the pipeline: a fixed-scale inferno colour map of the
    # depth, as ~10 Hz of JPEG. 32FC1 metres render as a near-black image in any
    # viewer that does not know what they are, and RViz's Image display has **no
    # colour map at all** — only a per-frame `Normalize Range`, which makes the
    # same distance a different shade from frame to frame. Colouring it here against
    # a fixed [0, max_range_m] means a colour is a distance. Near is bright, far is
    # black, so the 6 m clip is the quietest thing on screen rather than the
    # loudest. Its cost is reported separately in the stats line; 0 Hz disables it.
    preview_topic: /depth/image/compressed
    preview_rate_hz: 10.0
    preview_quality: 80
    # The GPU. false is gates/depth.sh's control run, reached through the launch
    # argument of the same name rather than by editing this file.
    use_cuda: true
    # **Arbitrary, and honestly so.** Monocular depth is scale-ambiguous: the model
    # says "twice as far", never "three metres". The room will be plausibly shaped
    # and the wrong size until P5 pins this against a tape measure — the
    # predecessor's came out at 2.69x. Do not tune it by eye against a mesh that
    # looks about right.
    depth_scale: 10.0
    # Applied to the model's *inverse* output before the reciprocal. 1/0 is inf,
    # not a big number, and one NaN integrated into a TSDF poisons voxels that
    # were fine.
    max_range_m: 6.0
    # The static edge pimesh_bringup publishes and test_transforms checks is the
    # optical convention. Named, never re-derived here.
    optical_frame: camera_optical_frame
    stats_period_s: 5.0

/**/depth_probe:
  ros__parameters:
    source_topic: /image_raw
    depth_topic: /depth
    rgb_topic: /depth/rgb
    # Overridden by gates/depth.sh, which sets the window from the clip's own
    # metadata. The value here is what a hand-run probe gets.
    duration_s: 60.0
    warmup_frames: 3
    # Must match depth_node's clip above, or the range assertion is measuring a
    # disagreement between two config keys rather than the depth.
    max_range_m: 6.0

# --- The map ------------------------------------------------------------------

/**/fusion_node:
  ros__parameters:
    # Both from depth_node, paired by stamp with **no tolerance**. depth_node
    # publishes the colour twin from the frame it actually inferred on precisely
    # so that pairing is exact; a tolerance here would colour a wall with the
    # picture of a different instant and nothing downstream could tell.
    depth_topic: /depth
    rgb_topic: /depth/rgb
    info_topic: /camera_info
    # The volume lives in map, not odom. A pose-graph backend correcting
    # map -> odom (P7/P8) must move the *frames*, not the surface underneath them.
    world_frame: map
    optical_frame: camera_optical_frame
    # Which process-local volume this fills. mesh_node reads the same key and a
    # mismatch is two volumes and an empty mesh — see pimesh_world/shared_volume.hpp
    # for why the two nodes share memory rather than a topic.
    volume_key: world
    # P5's numbers. 15 mm voxels keep a desk edge; 4 voxels of truncation is 6 cm
    # of band, which has to be wider than the depth noise being averaged or
    # observations of the same wall never land in the same voxel. Three
    # observations before a voxel is meshed is the noise floor: a single frame's
    # flying pixel at an object edge is exactly what it excludes.
    voxel_size_m: 0.015
    truncation_voxels: 4
    min_weight: 3.0
    # Where the running average saturates. An unbounded weight is a map that has
    # stopped listening, which looks fine until something has to give way.
    max_weight: 64.0
    # **Must match depth_node's max_range_m above.** Beyond it a reading is the
    # model's "far away or no idea" and integrating it builds a shell of the clip
    # plane — a room with a smooth dome over it that looks like a ceiling.
    max_range_m: 6.0
    min_range_m: 0.15
    # Pixel stride of the block-allocation pass only; the update pass that follows
    # reads every pixel. At fx=953 and 6 m, 8 pixels is 5 cm — well inside a 12 cm
    # block, so nothing in the frustum is missed and it is 64x less hash traffic.
    allocation_stride: 8
    # A hard ceiling on the map, in 6 kB blocks: 300 000 is ~1.9 GB, and P6's
    # mesher takes a *copy*, so budget twice that. **desk1 reaches it, and that is
    # a symptom rather than a resolution set too fine** — 145 000 blocks after 40 s
    # is 2090 m2 of surface for a room with perhaps 60 m2 in it, which is thirty
    # layers of the same wall laid down by rotation-only odometry (P7), an unpinned
    # depth_scale (a tape measure and a person), and a per-frame scale wobble well
    # past the aligner's clamp. The ceiling is what stops a session dying of memory
    # while those are outstanding; it fixes none of them.
    max_blocks: 300000
    # Per-frame scale alignment. The model's output scale wobbles ~4% frame to
    # frame, which at 2.5 m is 10 cm — wider than the truncation band, so unaligned
    # frames stack into shingles instead of averaging into a wall. false is
    # gates/fusion.sh's control run, reached through the launch argument of the
    # same name rather than by editing this file.
    align: true
    min_overlap: 0.2
    max_correction: 0.15
    align_window: 50
    # 16 gives 80x45 rays: thousands of samples for a median, a few milliseconds
    # of marching. The aligner needs a statistic, not a picture.
    raycast_stride: 16
    # How close, as a *fraction* of the distance, the map has to be to an incoming
    # reading to count as agreeing with it. Relative and not absolute because
    # depth_scale is unpinned — until a tape measure fixes it, centimetres here are
    # unknown units. gates/fusion.sh compares this figure between its aligned and
    # unaligned runs; the median gap does not discriminate, because it is
    # conditioned on the ray-cast having found something and the two runs differ in
    # how often it does.
    agree_tolerance: 0.05
    # Slack, not a design rate. keypoint_node publishes the pose for a frame ~50 ms
    # before depth_node finishes inferring on it, so this wait is normally zero.
    tf_timeout_ms: 50.0
    stats_period_s: 5.0
