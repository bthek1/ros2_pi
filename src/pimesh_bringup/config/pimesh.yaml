# Every parameter this workspace sets, keyed by node name.
#
# `/**` matches any namespace, so a key reaches its node whether it sits at the
# root or is pushed under one by a launch file. A key that matches *nothing* is
# not an error and never will be: the file loads, the parameter is silently
# never applied, and the node runs on its code default. That is the trap this
# project's predecessor lost real time to, so every gate here asserts on a
# parameter's *effect* rather than on the file having been read.

# --- The camera's place on the body -----------------------------------------
#
# Two static edges, base_link -> camera_link -> camera_optical_frame, published
# by tf2_ros/static_transform_publisher rather than hand-rolled inside a node.
# There is exactly one publisher per edge in this project and this is where both
# of these live; a node that publishes its own base_link -> camera_link is the
# failure that makes a mesh smear and shows up in no single log.

/**/base_to_camera:
  ros__parameters:
    frame_id: base_link
    child_frame_id: camera_link
    # Identity, and honestly so: the C922 is hand-held, so there is no measured
    # offset between the body origin and the camera yet. When it is mounted,
    # this is the one place that changes and nothing recompiles.
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

/**/camera_to_optical:
  ros__parameters:
    frame_id: camera_link
    child_frame_id: camera_optical_frame
    translation: {x: 0.0, y: 0.0, z: 0.0}
    # The REP-103 body convention (x forward, y left, z up) rotated into the
    # optical convention (z forward, x right, y down). This exact quaternion,
    # (-0.5, 0.5, -0.5, 0.5), is the standard -90 deg about z then -90 deg about
    # x; it is not a number to re-derive per node, which is why it is a static
    # transform published once and read by everything.
    #
    # All geometry in this pipeline — keypoint rays, depth unprojection, TSDF
    # integration — is done in camera_optical_frame. This edge is what lets the
    # rest of the tree stay in the body convention.
    rotation: {x: -0.5, y: 0.5, z: -0.5, w: 0.5}

# The map -> odom edge, published as static identity until there is a pose-graph
# backend to publish it for real (P8). Stated here rather than hidden, because
# "the frame exists so RViz has a fixed frame" and "the map is being corrected"
# look identical in a TF tree and are not the same claim.
/**/map_to_odom:
  ros__parameters:
    frame_id: map
    child_frame_id: odom
    translation: {x: 0.0, y: 0.0, z: 0.0}
    rotation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

# --- The dev box's pipeline ---------------------------------------------------
#
# Keyed by node name, and the names have to match the `name=` of the
# ComposableNode in pimesh.launch.py exactly. A key matching no node applies
# nothing, silently — which is why every gate here asserts on a parameter's
# *effect*, never on the file having been read.

/**/decode_node:
  ros__parameters:
    # The only topic in this project that crosses Wi-Fi, and the only subscriber
    # this process has on it. gates/ipc.sh asserts that second half.
    input_topic: /image_raw/compressed
    # bgr8, for consumers inside this container. A subscriber from another
    # process may have it, and will cost a 2.7 MB serialisation per frame for the
    # privilege — which is why rviz/keypoints.rviz watches the compressed preview
    # instead.
    output_topic: /image_raw
    # reliable | best_effort, on the subscription. See decode_node.cpp: the
    # BEST_EFFORT-reader measurement that rviz/camera.rviz relies on was taken on
    # a *viewer*, where a dropped frame costs nothing, and a dropped frame here is
    # a frame the mesh never sees. The conservative default stands until somebody
    # measures this end.
    input_reliability: reliable
    gap_threshold_ms: 50.0
    stats_period_s: 5.0
    # Off: at 59 Hz this is 59 log lines a second. gates/ipc.sh overrides it.
    log_payloads: false

/**/ipc_probe:
  ros__parameters:
    input_topic: /image_raw

/**/odom_probe:
  ros__parameters:
    # tools/gates/odom.sh's instrument, loaded with probe:=odom_probe. Measures the
    # trajectory off the topic rather than off keypoint_node's own counters,
    # because the failure P7 fixed was a pose every internal number described
    # correctly and that left the node inverted.
    odom_topic: /odom
    # Empty writes nothing. tools/gates/trajectory.sh overrides it through the
    # launch argument of the same name — the file it names is what `evo` reads to
    # produce the first number in this project about the pose that does not come
    # out of this project. Default empty because every *other* gate loads this
    # probe too and none of them wants a file.
    trajectory_path: ""
    # **Must match camera_to_optical's child_frame_id.** The written trajectory is
    # the *camera's* pose, because that is what a public benchmark's ground truth
    # is; /odom carries the body frame, and the two differ by a constant rotation
    # that an ATE cannot see and an RPE can — measured at 0.654 m over a 1 s
    # window against a trajectory that was exactly right. The quaternion is not
    # written here: the probe looks the edge up in the TF tree, so there is one
    # copy of it. test_transforms asserts the pair.
    optical_frame: camera_optical_frame

# --- The dataset, which is where the frames come from when the Pi does not ----

/**/dataset_node:
  ros__parameters:
    # Loaded only with source:=dataset_node, and never beside the camera: two
    # publishers on /image_raw/compressed is the "one session at a time" failure
    # seen from the producing end, where neither session is doing anything wrong.
    #
    # **No dataset_dir here, and that is the point.** A path in this file would be
    # a default, and a replay source with a default is one that can start without
    # anybody having chosen it. tools/gates/trajectory.sh passes it through the
    # launch argument; the node refuses to construct without one.
    index_name: rgb.txt
    # camera_node's two topics. Nothing downstream may be able to tell which of
    # the two is publishing — that is the whole basis on which a trajectory
    # measured against TUM's ground truth says anything about the pipeline that
    # runs on the Pi's camera.
    image_topic: /image_raw/compressed
    info_topic: /camera_info
    # **Somebody else's camera, and named as such.** The loader is handed the size
    # of the first decoded frame, so this file's 640x480 is checked against the
    # frames rather than asserted beside them — serving c922_720p.yaml here is a
    # node that will not start.
    camera_info_url: package://pimesh_bringup/config/camera_info/tum_freiburg1.yaml
    # The optical convention, the same string camera_node stamps with.
    frame_id: camera_optical_frame
    # Real time. A slower replay gives the pipeline more time per frame, which
    # makes the posed fraction go up and the number stop being about a 30 Hz
    # camera; it is a diagnostic, not a run.
    rate_scale: 1.0
    max_frames: 0
    stats_period_s: 0.1

/**/keypoint_node:
  ros__parameters:
    # P3's numbers. 500 features is enough that churn at the cap does not dominate
    # and cheap enough for the full frame rate; the 10-frame window is what
    # forgives detection churn, which strict frame-to-frame matching counts as
    # ~25% of keypoints lost; 64 of 256 Hamming bits is already generous, since
    # unrelated ORB descriptors sit near 128 apart.
    #
    # The window is also what spans the gap between two depth frames: at 59 Hz in
    # and 17 Hz out, consecutive depth maps are ~3 frames apart, so a window under
    # 4 would leave odometry_node with no correspondences at all.
    max_features: 500
    match_window: 10
    match_max_distance: 64
    # For a person, not for the pipeline: ~10 Hz of annotated JPEG. Encoding it
    # costs more than detecting the features does, which is why it is capped and
    # why its cost is reported separately in the stats line.
    preview_rate_hz: 10.0
    preview_quality: 80
    stats_period_s: 5.0

/**/odometry_node:
  ros__parameters:
    # **This block was part of keypoint_node's until 2026-09-23.** That node
    # published two /pipeline/stats rows because it was two stages wearing one
    # name; they are two nodes now, and every parameter below moved unchanged.
    #
    # --- Which estimator drives the pose (P7) ----------------------------------
    #
    # sixdof pairs each frame's corners with its own depth map and fits a rigid
    # transform to the landmarks; rotation_only is P3's bearing-ray fit, which
    # publishes translation identically zero. The second is a *control*, not a
    # fallback — tools/gates/odom.sh runs the clip through both, because a claim
    # that translation improves the surface needs a run without it. Reached
    # through the `odom_regime:=` launch argument rather than by editing this file.
    odometry: sixdof
    # **Must name keypoint_node's published topic and depth_node's own
    # depth_topic.** A mismatch is not a partial failure: this node would never
    # see a corner or never see a depth map, hold its pose for the whole session,
    # and look exactly like a camera that is not moving. test_transforms asserts
    # both pairs.
    keypoints_topic: /keypoints
    depth_topic: /depth
    # The rotation gates. Failing either means *hold the last pose* — never
    # publish a guess, because a wrong orientation folds the mesh around it and
    # nothing downstream can tell which frames were guesses.
    #
    # 0.03 rad is 1.7 degrees, ~28 px at fx=953. Note it is not equally sharp in
    # all three axes: the ray residual of a roll about the optical axis is about a
    # third of the same angle in pan or tilt, because rays near the axis of
    # rotation barely move (test_rotation_fit has the measurement).
    min_matched_pairs: 8
    max_residual_rad: 0.03
    reject_fraction: 0.2
    # The 6-DoF gates, and they are the point-cloud versions of the three above.
    # 12 pairs rather than 8 because three points already determine a rigid
    # transform exactly, so a handful of them fits its own noise perfectly and
    # reports a residual of zero. The reject fraction is higher for the same
    # reason the residual is measured in metres: a ray can be at most 180 degrees
    # wrong, while a depth reading off the far side of an occlusion edge is metres
    # out and drags the translation with it.
    #
    # Estimate the scale difference between two frames' landmarks and throw it
    # away. **Measured, not reasoned**: with it off the estimator reported an
    # 89.5 m path over a 45 s desk sweep and a surface *worse* than rotation-only
    # odometry, because a rigid fit has nowhere to put the depth network's
    # frame-to-frame scale wobble except into translation along the view axis.
    # fusion_node's aligner exists for the same wobble and hits its 15% clamp on
    # one frame in seven of this clip.
    divide_out_depth_scale: true
    # pnp | points. pnp poses each frame from the keyframe's 3D landmarks and this
    # frame's *pixels*, so only one depth map is involved and the translation comes
    # from reprojection geometry rather than from differencing two noisy depth maps.
    # points is the obvious alternative — a rigid fit between two unprojected
    # clouds — and it is the control: see PnpFit in rgbd_odometry.hpp for the four
    # measurements that ended with it.
    pose_solver: pnp
    # RANSAC inlier threshold and the refusal ceiling, both in pixels. Generous
    # beside the 0.4955 px this camera's calibration reprojects at, because the 3D
    # points being fitted come from a monocular depth network and carry its error,
    # not the lens's. **In pixels on purpose**: the metres this pipeline works in
    # are arbitrary until depth_scale is pinned with a tape measure, so a gate in
    # metres is a gate on an unknown unit.
    pnp_inlier_px: 3.0
    max_reprojection_px: 2.0
    # A new reference keyframe when fewer than this many of its landmarks are
    # still tracked, whatever the angle and distance thresholds below say. A
    # keyframe the camera has turned away from satisfies both of those right up
    # until it does not, and its last surviving correspondences sit in one corner
    # of the frame — the one geometry a translation fit is genuinely bad on.
    keyframe_min_shared: 60
    # **The gate a reprojection error cannot supply.** PnP reports how well its
    # pose explains the pixels it was given and has no opinion about whether the
    # 3D points behind them are where the depth network said. Measured on
    # bags/desk1: a single step of 9.4 m between two depth frames at a mean inlier
    # reprojection of 1.23 px, which then became the reference every later frame
    # was measured from. In the map's arbitrary units — landmarks are clipped at
    # max_depth_m, so 2.0 m/s is about a third of the visible depth per second.
    max_speed_m_s: 2.0
    max_turn_rad_s: 6.0
    # Consecutive depth frames without a usable fit before the reference view is
    # replaced at the held pose. Without it, losing track once loses it for the
    # rest of the session: the first version only replaced the reference on a
    # *successful* fit, and measured on bags/desk1 that froze pose_ok at 188 while
    # held climbed past 560. Replacing it bakes in the drift of the lost stretch,
    # which is the better of the two.
    max_hold_frames: 5
    # A low-pass on the measured position, in seconds. The one filter in this
    # pipeline, and it is here because the signal and the noise sit in different
    # bands: a hand sweeping a room moves centimetres a second, while the
    # translation estimate's error is white at the depth rate and measured ~0.09 m
    # per sample against ~0.003 m of real motion per sample. A better estimator
    # does not change that ratio — a monocular depth network's error is structured
    # and three hundred landmarks share most of it — but refusing to believe the
    # camera moved 9 cm and back in 57 ms does. 0 disables it.
    translation_tau_s: 0.0
    min_landmark_pairs: 12
    max_point_residual_m: 0.05
    point_reject_fraction: 0.3
    # A keypoint's depth is the median of a 3x3 patch, refused when the patch
    # spreads more than 10%. ORB puts corners on edges by construction and an edge
    # is where a depth map steps between foreground and background, so a
    # single-pixel read at a corner lands on either side of the step at random.
    depth_patch: 3
    depth_patch_spread: 0.1
    min_depth_m: 0.2
    # **Must match depth_node's max_range_m below**, for the same reason
    # fusion_node's does: past it a reading is the model's "far away or no idea",
    # and a landmark on the clip plane is a landmark on a surface that does not
    # exist. test_transforms asserts the pair.
    max_depth_m: 6.0
    # Frames of ORB output kept waiting for their depth map. depth_node costs
    # ~55 ms, so a depth map arrives ~3 frames after its image; 90 is ~1.5 s at
    # 59 Hz, which is headroom of a different order rather than a tight fit.
    history_frames: 90
    # The keyframe store. **Every frame's pose is measured against the newest
    # keyframe rather than against the previous frame**, and that is a change P7's
    # plan did not call for: frame-to-frame chaining is a random walk whose error
    # per step is the size of one step's real motion, and on bags/desk1 it reported
    # a 117 m path, 6.9 m of net drift, and a surface worse than rotation-only
    # odometry. Measuring from a keyframe sets the pose absolutely instead of
    # accumulating it. Either threshold alone admits a new one: a camera panning on
    # the spot travels no distance and still sees a different room.
    keyframe_angle_deg: 18.0
    keyframe_distance_m: 0.3
    max_keyframes: 500
    # odom -> base_link. Rotation only in the rotation_only regime; a real
    # translation in sixdof, published at the depth rate at each depth map's own
    # stamp, which is exactly the set of stamps fusion_node looks up.
    publish_tf: true
    odom_frame: odom
    base_frame: base_link
    stats_period_s: 5.0

/**/depth_node:
  ros__parameters:
    # Two consumers on the decoded topic now — keypoint_node and this one — which
    # is the configuration the zero-copy claim is actually about. See
    # depth_node.hpp: rclcpp moves the buffer into the *last* ownership-taking
    # subscription and copies it for every other, so both of them take a
    # ConstSharedPtr and gates/ipc.sh asserts at least two subscribers while it
    # measures.
    input_topic: /image_raw
    # 32FC1 metres, and the exact frame each map was inferred on. The second is
    # not a convenience: a separate republisher would drop *different* frames from
    # this node, so their stamp sets would rarely intersect and an exact-sync
    # consumer would limp at a fraction of either rate.
    depth_topic: /depth
    rgb_topic: /depth/rgb
    publish_rgb: true
    # For a person, not for the pipeline: a fixed-scale inferno colour map of the
    # depth, as ~10 Hz of JPEG. 32FC1 metres render as a near-black image in any
    # viewer that does not know what they are, and RViz's Image display has **no
    # colour map at all** — only a per-frame `Normalize Range`, which makes the
    # same distance a different shade from frame to frame. Colouring it here against
    # a fixed [0, max_range_m] means a colour is a distance. Near is bright, far is
    # black, so the 6 m clip is the quietest thing on screen rather than the
    # loudest. Its cost is reported separately in the stats line; 0 Hz disables it.
    preview_topic: /depth/image/compressed
    preview_rate_hz: 10.0
    preview_quality: 80
    # The GPU. false is gates/depth.sh's control run, reached through the launch
    # argument of the same name rather than by editing this file.
    use_cuda: true
    # **Arbitrary, and honestly so.** Monocular depth is scale-ambiguous: the model
    # says "twice as far", never "three metres". The room will be plausibly shaped
    # and the wrong size until P5 pins this against a tape measure — the
    # predecessor's came out at 2.69x. Do not tune it by eye against a mesh that
    # looks about right.
    depth_scale: 10.0
    # Applied to the model's *inverse* output before the reciprocal. 1/0 is inf,
    # not a big number, and one NaN integrated into a TSDF poisons voxels that
    # were fine.
    max_range_m: 6.0
    # The static edge pimesh_bringup publishes and test_transforms checks is the
    # optical convention. Named, never re-derived here.
    optical_frame: camera_optical_frame
    stats_period_s: 5.0

/**/depth_probe:
  ros__parameters:
    source_topic: /image_raw
    depth_topic: /depth
    rgb_topic: /depth/rgb
    # Overridden by gates/depth.sh, which sets the window from the clip's own
    # metadata. The value here is what a hand-run probe gets.
    duration_s: 60.0
    warmup_frames: 3
    # Must match depth_node's clip above, or the range assertion is measuring a
    # disagreement between two config keys rather than the depth.
    max_range_m: 6.0

# --- The map ------------------------------------------------------------------

/**/fusion_node:
  ros__parameters:
    # Both from depth_node, paired by stamp with **no tolerance**. depth_node
    # publishes the colour twin from the frame it actually inferred on precisely
    # so that pairing is exact; a tolerance here would colour a wall with the
    # picture of a different instant and nothing downstream could tell.
    depth_topic: /depth
    rgb_topic: /depth/rgb
    info_topic: /camera_info
    # The volume lives in map, not odom. A pose-graph backend correcting
    # map -> odom (P7/P8) must move the *frames*, not the surface underneath them.
    world_frame: map
    optical_frame: camera_optical_frame
    # Which process-local volume this fills. mesh_node reads the same key and a
    # mismatch is two volumes and an empty mesh — see pimesh_mapping/shared_volume.hpp
    # for why the two nodes share memory rather than a topic.
    volume_key: world
    # P5's numbers. 15 mm voxels keep a desk edge; 4 voxels of truncation is 6 cm
    # of band, which has to be wider than the depth noise being averaged or
    # observations of the same wall never land in the same voxel. Three
    # observations before a voxel is meshed is the noise floor: a single frame's
    # flying pixel at an object edge is exactly what it excludes.
    voxel_size_m: 0.015
    truncation_voxels: 4
    min_weight: 3.0
    # Where the running average saturates. An unbounded weight is a map that has
    # stopped listening, which looks fine until something has to give way.
    max_weight: 64.0
    # **Must match depth_node's max_range_m above.** Beyond it a reading is the
    # model's "far away or no idea" and integrating it builds a shell of the clip
    # plane — a room with a smooth dome over it that looks like a ceiling.
    max_range_m: 6.0
    min_range_m: 0.15
    # Pixel stride of the block-allocation pass only; the update pass that follows
    # reads every pixel. At fx=953 and 6 m, 8 pixels is 5 cm — well inside a 12 cm
    # block, so nothing in the frustum is missed and it is 64x less hash traffic.
    allocation_stride: 8
    # A hard ceiling on the map, in 6 kB blocks: 300 000 is ~1.9 GB, and P6's
    # mesher takes a *copy*, so budget twice that. **desk1 reaches it, and that is
    # a symptom rather than a resolution set too fine** — 145 000 blocks after 40 s
    # is 2090 m2 of surface for a room with perhaps 60 m2 in it, which is thirty
    # layers of the same wall laid down by rotation-only odometry (P7), an unpinned
    # depth_scale (a tape measure and a person), and a per-frame scale wobble well
    # past the aligner's clamp. The ceiling is what stops a session dying of memory
    # while those are outstanding; it fixes none of them.
    max_blocks: 300000
    # Per-frame scale alignment. The model's output scale wobbles ~4% frame to
    # frame, which at 2.5 m is 10 cm — wider than the truncation band, so unaligned
    # frames stack into shingles instead of averaging into a wall. false is
    # gates/fusion.sh's control run, reached through the launch argument of the
    # same name rather than by editing this file.
    align: true
    min_overlap: 0.2
    max_correction: 0.15
    align_window: 50
    # 16 gives 80x45 rays: thousands of samples for a median, a few milliseconds
    # of marching. The aligner needs a statistic, not a picture.
    raycast_stride: 16
    # How close, as a *fraction* of the distance, the map has to be to an incoming
    # reading to count as agreeing with it. Relative and not absolute because
    # depth_scale is unpinned — until a tape measure fixes it, centimetres here are
    # unknown units. gates/fusion.sh compares this figure between its aligned and
    # unaligned runs; the median gap does not discriminate, because it is
    # conditioned on the ray-cast having found something and the two runs differ in
    # how often it does.
    agree_tolerance: 0.05
    # Slack, not a design rate. keypoint_node publishes the pose for a frame ~50 ms
    # before depth_node finishes inferring on it, so this wait is normally zero.
    tf_timeout_ms: 50.0
    stats_period_s: 5.0

/**/mesh_node:
  ros__parameters:
    # A TRIANGLE_LIST Marker, latched. Latched is not this workspace's usual
    # choice — everywhere else is KEEP_LAST(1) volatile, freshest frame and no
    # backlog — and it is right here because this is not a stream: it changes
    # every ten seconds, and an RViz started between two extractions would show an
    # empty 3D view that looks exactly like a topic nobody publishes.
    mesh_topic: /world/mesh
    world_frame: map
    # Must match fusion_node's volume_key above. A mismatch is two volumes and a
    # mesh that is silently always empty — see pimesh_mapping/shared_volume.hpp for
    # why these two nodes share memory rather than a topic.
    volume_key: world
    marker_ns: world_mesh
    # Human rate, not frame rate. Accumulation happens at ~16 Hz; this is what a
    # person can follow, and it is deliberately decoupled so the extraction can
    # cost seconds without the integrator noticing.
    remesh_period_s: 10.0
    # **The honest lever on a mesh that is mostly layers of the same wall.** Not
    # the same question as fusion_node's min_weight, which is the noise floor for
    # ray-casting: a voxel seen three times is real enough to stop a ray and thin
    # enough to be one of the shingles a rotation-only sweep lays down.
    mesh_min_weight: 24.0
    # Debris islands. Their outer boundaries masquerade as holes, and the honest
    # fix is to remove the flakes rather than cap them into blobs.
    min_component_triangles: 30
    # Interior boundary loops narrower than this are fanned shut. Each component's
    # *largest* loop is its frontier and is never closed whatever its size — a
    # sealed box with no openings is the failure that looks most like success.
    max_hole_radius_m: 0.25
    # The cap on the published Marker, reached by quadric decimation and never by
    # subsampling. /world/save_mesh writes the full-detail surface: a Marker is
    # rebuilt and re-serialised on every publish, a file is written once.
    max_triangles: 120000
    # Blocks copied per lock acquisition. ~12 MB and a few milliseconds each; one
    # lock over a 1.3 GB map would hold the integrator out for over a hundred,
    # which is exactly the dip gates/mesh.sh asserts is absent.
    snapshot_chunk_blocks: 2048
    # **The mesher must lose to the pipeline, and at equal priority it does not.**
    # Measured while an extraction ran: depth_node's rate fell from 17.8 to 14.6 Hz
    # with its per-frame cost unchanged at 55.9 ms — not more work, just not being
    # scheduled — and fusion inherited a 404 ms gap between integrations. Marching
    # cubes and decimation are seconds of pure CPU with no deadline; every stage
    # above them has one. Linux nice is per-thread, so only the extraction is
    # pushed down and the node's services and timer are not.
    worker_nice: 10
    # Empty means the directory the container was started in. tools/gates/mesh.sh
    # sets it to a temp directory of its own.
    save_dir: ""

# --- The view ------------------------------------------------------------------

/**/dashboard_node:
  ros__parameters:
    # One browser tab at http://localhost:8080, in its own process. Started with
    # `dashboard:=true` — off by default, because a viewer attached to every run
    # would be in every measurement this workspace takes.
    port: 8080
    # Empty means the package's own share/web, where the vendored assets are
    # installed. There is no CDN here on purpose: the LAN may have no internet,
    # and a monitoring tool that breaks when DNS does is not one.
    web_root: ''
    # **The pacing rule, in one number.** A backgrounded browser stops reading and
    # its socket buffer fills; without a ceiling the server's queue would grow
    # until the process died, with the pipeline slowing down first. Past this,
    # frames are dropped and counted, and the count is on the page. Nothing the
    # dashboard does may slow the mesh down.
    send_limit_bytes: 8388608
    max_clients: 8
    # The panel's cadence, and the two image strips'. The strips are pictures for
    # a person; the sources already cap themselves near these rates and this caps
    # them again on the way out.
    stats_rate_hz: 10.0
    rgb_rate_hz: 10.0
    depth_rate_hz: 5.0
    # Seconds without a message before a row reads STALE. **Measured on receipt,
    # never on header.stamp**: the capture row is stamped on the Pi and read here,
    # and that difference is NTP's business — it measured +8 ms and -19 ms an hour
    # apart with nothing changed.
    stale_after_s: 2.0
    trail_points: 600
    # What it draws, all of it published by somebody else. The dashboard computes
    # nothing: every number on the page is a number some node measured about
    # itself, so the page and `ros2 topic echo` cannot disagree.
    stats_topic: /pipeline/stats
    rgb_topic: /keypoints/image/compressed
    depth_topic: /depth/image/compressed
    odom_topic: /odom
    mesh_topic: /world/mesh
    # The save button's directory. The service takes a path and this node supplies
    # the directory, because a browser must not get to choose where a process
    # writes a file.
    save_dir: /tmp
    action_timeout_s: 10.0
