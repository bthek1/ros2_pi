# Parameters for the pimesh pipeline.
#
# KEYED BY NODE NAME. A top-level key that does not match a running node's name
# applies nothing at all — no warning, no error, no effect. This trap has cost
# the predecessor project real time more than once; check `ros2 node list`
# against the keys here before concluding a parameter "does not work".
#
# Every parameter a node reads is declared in the node with a description and a
# validated range. This file supplies values, not the schema.
#
# Each phase of the bootstrap plan adds its own section as its node lands.
# Sections for nodes that do not exist yet are deliberately absent rather than
# commented-out guesses.

# --- P1, on the Pi ---------------------------------------------------------
#
# camera_node's parameters live in pimesh_camera/config/camera.yaml, NOT here.
# The Pi builds only pimesh_msgs and pimesh_camera, so the sensor head has to
# carry its own launch and its own configuration — it must be startable with
# nothing from the dev box present.

# --- P2, in the container --------------------------------------------------

decode_node:
  ros__parameters:
    # The container's only network subscriber and its only JPEG decode.
    stats_period_s: 1.0
    # No frame for this long marks the stage stale on /pipeline/stats. Two
    # seconds is ~60 frames at the camera's rate: long enough that a Wi-Fi
    # hiccup does not flap the flag, short enough to notice a dead Pi.
    stale_after_s: 2.0
    # Address logging is a diagnostic for `just gate-ipc`, which overrides this
    # on the command line. Zero here so a normal session logs nothing.
    log_buffer_addresses: 0

ipc_probe_node:
  ros__parameters:
    # Only loaded when the launch is given `probe:=true`. Ten frames is plenty
    # to compare addresses and short enough not to bury the launch output.
    frames: 10
