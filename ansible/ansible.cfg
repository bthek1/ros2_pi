[defaults]
inventory = inventory.yml
roles_path = roles

# Pinned, never auto-discovered. Auto-discovery walks PATH, and on this control
# node that finds PlatformIO's venv Python (and uv's), neither of which can
# `import apt` — every apt task would then fail with a module error that looks
# nothing like its cause. It is the same shadowed-interpreter trap that breaks
# `colcon build` here; see docs/info/troubleshooting.md.
interpreter_python = /usr/bin/python3

# `stdout_callback = yaml` meant community.general.yaml, which that collection
# removed in 12.0.0. This is the documented replacement: same output, no
# collection dependency.
stdout_callback = ansible.builtin.default
result_format = yaml

[ssh_connection]
# Roughly halves the round-trips to the Pi, which matters over Wi-Fi.
pipelining = True
# BatchMode + ConnectTimeout for the same reason every scripted `ssh pi` in this
# repo carries them: a bare ssh hangs ~2 minutes against a dead Wi-Fi link, and
# the Pi's link has died twice while the OS kept running. The ControlMaster pair
# is ansible's own default, restated because setting ssh_args replaces it.
ssh_args = -C -o BatchMode=yes -o ConnectTimeout=5 -o ControlMaster=auto -o ControlPersist=60s
